<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>寰宇教</title>
<style>
  :root {
    --bg: #04050c;
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { height: 100%; }
  html { scroll-snap-type: y mandatory; }
  body {
    background: var(--bg);
    color: #eae7f5;
    font-family: "Noto Serif SC", "Source Han Serif SC", "STSong", "SimSun", serif;
    overflow-x: hidden;
    -webkit-font-smoothing: antialiased;
  }

  /* 星空画布 */
  canvas#stars {
    position: fixed;
    inset: 0;
    z-index: 0;
    display: block;
  }

  /* 背景光晕 */
  .glow-bg {
    position: fixed;
    inset: 0;
    z-index: 0;
    pointer-events: none;
    background:
      radial-gradient(60% 50% at 50% 8%,  rgba(79, 170, 255, .10), transparent 70%),
      radial-gradient(55% 45% at 50% 50%, rgba(245, 197, 66, .06), transparent 70%),
      radial-gradient(60% 50% at 50% 92%, rgba(178, 107, 255, .12), transparent 70%);
  }

  /* 滚动提示 */
  .scroll-hint {
    position: fixed;
    left: 50%;
    bottom: 28px;
    transform: translateX(-50%);
    z-index: 3;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 8px;
    color: rgba(234, 231, 245, .55);
    font-size: 12px;
    letter-spacing: 4px;
    transition: opacity .5s ease, visibility .5s ease;
  }
  .scroll-hint .arrow {
    width: 12px;
    height: 12px;
    border-right: 1px solid rgba(234, 231, 245, .6);
    border-bottom: 1px solid rgba(234, 231, 245, .6);
    transform: rotate(45deg);
    animation: bob 1.6s ease-in-out infinite;
  }
  .scroll-hint.hidden { opacity: 0; visibility: hidden; }
  @keyframes bob {
    0%, 100% { transform: rotate(45deg) translate(0, 0); }
    50%      { transform: rotate(45deg) translate(4px, 4px); }
  }

  /* 主滚动容器 */
  main {
    position: relative;
    z-index: 1;
  }
  .panel {
    height: 100vh;
    min-height: 100svh;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    scroll-snap-align: center;
    scroll-snap-stop: always;
    padding: 24px;
  }

  /* 印章 */
  .seal {
    width: 52px;
    height: 52px;
    border: 2px solid rgba(224, 82, 82, .85);
    border-radius: 6px;
    color: #e05252;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 26px;
    line-height: 1;
    margin-bottom: 28px;
    transform: rotate(-4deg);
    opacity: 0;
    transition: opacity 1s ease .2s;
    letter-spacing: 0;
  }
  .panel.active .seal { opacity: 1; }

  /* 主词 */
  .word {
    font-size: clamp(2.6rem, 11vw, 8.5rem);
    font-weight: 900;
    letter-spacing: .08em;
    text-align: center;
    white-space: nowrap;
    color: var(--glow);
    opacity: 0;
    transform: scale(1.6);
    filter: blur(40px);
  }
  .panel.active .word {
    animation: flashIn 2.6s cubic-bezier(.19, 1, .22, 1) forwards;
  }

  @keyframes flashIn {
    0%   { opacity: 0; transform: scale(1.6); filter: blur(40px);
           text-shadow: 0 0 60px var(--glow), 0 0 120px var(--glow); }
    20%  { opacity: 1; transform: scale(1.06); filter: blur(0);
           text-shadow: 0 0 150px var(--glow), 0 0 260px var(--glow), 0 0 400px var(--glow); }
    32%  { opacity: .5; transform: scale(1); filter: blur(0);
           text-shadow: 0 0 18px var(--glow); }
    44%  { opacity: 1;
           text-shadow: 0 0 120px var(--glow), 0 0 220px var(--glow); }
    56%  { opacity: .72;
           text-shadow: 0 0 28px var(--glow); }
    72%  { opacity: 1;
           text-shadow: 0 0 90px var(--glow), 0 0 170px var(--glow); }
    100% { opacity: 1; transform: scale(1); filter: blur(0);
           text-shadow: 0 0 26px var(--glow), 0 0 64px var(--glow), 0 0 110px var(--glow); }
  }

  /* 分隔线 */
  .divider {
    width: 0;
    height: 1px;
    margin-top: 34px;
    background: linear-gradient(90deg, transparent, var(--glow), transparent);
    opacity: 0;
    transition: width 1.1s ease .5s, opacity .8s ease .5s;
  }
  .panel.active .divider { width: min(340px, 60vw); opacity: .7; }

  /* 面板各自的光色 */
  .panel.p1 { --glow: #4fd8ff; }
  .panel.p2 { --glow: #f5c542; }
  .panel.p3 { --glow: #b26bff; }
  .panel.p3 .word { letter-spacing: .1em; }
  .panel.p3 .divider {
    background: linear-gradient(90deg, transparent, #f5c542, #b26bff, transparent);
  }
</style>
</head>
<body>
<canvas id="stars"></canvas>
<div class="glow-bg"></div>

<main>
  <section class="panel p1">
    <div class="seal">壹</div>
    <div class="word">人世间</div>
    <div class="divider"></div>
  </section>
  <section class="panel p2">
    <div class="seal">贰</div>
    <div class="word">笑看间</div>
    <div class="divider"></div>
  </section>
  <section class="panel p3">
    <div class="seal">叁</div>
    <div class="word">唯我寰宇支配间</div>
    <div class="divider"></div>
  </section>
</main>

<div class="scroll-hint" id="hint">
  <span>向下滑动</span>
  <div class="arrow"></div>
</div>

<script>
(function () {
  const canvas = document.getElementById('stars');
  const ctx = canvas.getContext('2d');
  const mouse = { x: -9999, y: -9999 };
  let W = 0, H = 0, dpr = 1;
  let stars = [];

  function resize() {
    dpr = Math.min(window.devicePixelRatio || 1, 2);
    W = window.innerWidth;
    H = window.innerHeight;
    canvas.width = W * dpr;
    canvas.height = H * dpr;
    canvas.style.width = W + 'px';
    canvas.style.height = H + 'px';
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    seed();
  }

  function seed() {
    const count = Math.min(220, Math.floor((W * H) / 8500));
    stars = [];
    for (let i = 0; i < count; i++) {
      stars.push({
        x: Math.random() * W,
        y: Math.random() * H,
        vx: (Math.random() - .5) * .12,
        vy: (Math.random() - .5) * .12,
        r: Math.random() * 1.6 + .3,
        base: Math.random() * .5 + .15,
        tw: Math.random() * Math.PI * 2,
      });
    }
  }

  function tick() {
    ctx.clearRect(0, 0, W, H);

    for (const s of stars) {
      s.x += s.vx;
      s.y += s.vy;
      if (s.x < -10) s.x = W + 10; else if (s.x > W + 10) s.x = -10;
      if (s.y < -10) s.y = H + 10; else if (s.y > H + 10) s.y = -10;

      s.tw += .02;
      const a = s.base * (0.6 + 0.4 * Math.sin(s.tw));
      ctx.beginPath();
      ctx.arc(s.x, s.y, s.r, 0, Math.PI * 2);
      ctx.fillStyle = 'rgba(210, 225, 255, ' + a.toFixed(3) + ')';
      ctx.fill();
    }

    // 鼠标附近粒子连接线
    if (mouse.x > 0 && mouse.y > 0) {
      for (const s of stars) {
        const dx = s.x - mouse.x;
        const dy = s.y - mouse.y;
        const d2 = dx * dx + dy * dy;
        if (d2 < 180 * 180) {
          const d = Math.sqrt(d2);
          const a = (1 - d / 180) * .35;
          ctx.beginPath();
          ctx.moveTo(mouse.x, mouse.y);
          ctx.lineTo(s.x, s.y);
          ctx.strokeStyle = 'rgba(150, 180, 255, ' + a.toFixed(3) + ')';
          ctx.lineWidth = 0.6;
          ctx.stroke();
        }
      }
    }

    requestAnimationFrame(tick);
  }

  window.addEventListener('resize', resize);
  window.addEventListener('mousemove', e => { mouse.x = e.clientX; mouse.y = e.clientY; });
  window.addEventListener('mouseleave', () => { mouse.x = -9999; mouse.y = -9999; });

  resize();
  tick();

  // 滚动触发「闪出」
  const panels = document.querySelectorAll('.panel');
  const observer = new IntersectionObserver(entries => {
    entries.forEach(entry => {
      if (entry.isIntersecting) entry.target.classList.add('active');
    });
  }, { threshold: 0.5 });
  panels.forEach(p => observer.observe(p));

  // 滚动提示的隐藏
  const hint = document.getElementById('hint');
  window.addEventListener('scroll', () => {
    hint.classList.toggle('hidden', window.scrollY > 60);
  }, { passive: true });
})();
</script>
</body>
</html>
